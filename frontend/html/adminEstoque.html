<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="../img/favicon.png">
    <link rel="stylesheet" href="../css/style.css">
    <script src="../js/config.js" defer></script>
    <script src="../js/carrinho.js" defer></script>
    <script src="../js/componentes.js" defer></script>
    <script src="../js/adminEstoque.js" defer></script>

    <title>Movimentação de Estoque - DIYBELLO</title>
</head>

<body>
    <header id="cabecalho"></header>

    <main>
        <div class="cabecalho_pagina">
            <h1>Movimentação de Estoque</h1>
            <p>
                Entrada e saída de mercadoria. Cada lançamento atualiza automaticamente
                o saldo do produto e fica registrado no histórico.
            </p>
            <p><a href="./admin.html">Voltar ao painel</a></p>
        </div>

        <div id="resposta"></div>

        <!-- ---------------- LANÇAMENTO ---------------- -->
        <form class="formulario" style="max-width: 100%;">
            <h2>Novo lançamento</h2>

            <div class="linha_form">
                <div class="campo">
                    <label for="produto_id">Produto *</label>
                    <select id="produto_id"></select>
                </div>

                <div class="campo">
                    <label for="tipo">Tipo da movimentação *</label>
                    <select id="tipo">
                        <option value="ENTRADA">Entrada (compra / reposição)</option>
                        <option value="SAIDA">Saída (perda / avaria / ajuste)</option>
                    </select>
                </div>

                <div class="campo">
                    <label for="quantidade">Quantidade *</label>
                    <input type="number" id="quantidade" min="1" value="1">
                </div>
            </div>

            <div class="campo">
                <label for="motivo">Motivo</label>
                <input type="text" id="motivo" placeholder="Ex: Compra do fornecedor de cera vegetal">
            </div>

            <div class="campo" id="saldo_atual_info"></div>

            <div style="display: flex; gap: 10px; flex-wrap: wrap;">
                <button type="button" id="btn_salvar">Registrar movimentação</button>
            </div>
        </form>

        <!-- ---------------- HISTÓRICO ---------------- -->
        <section style="margin-top: 28px;">
            <h2>Histórico de movimentações</h2>

            <form class="barra_filtros" id="form_busca">
                <div class="campo">
                    <label for="busca">Consultar por código ou nome do produto</label>
                    <input type="text" id="busca" placeholder="Ex: 1, Box Aura">
                </div>
                <div class="campo">
                    <label for="filtro_tipo">Tipo</label>
                    <select id="filtro_tipo">
                        <option value="">Todos</option>
                        <option value="ENTRADA">Somente entradas</option>
                        <option value="SAIDA">Somente saídas</option>
                    </select>
                </div>
                <div class="campo">
                    <button type="submit">Consultar</button>
                </div>
                <div class="campo">
                    <button type="button" id="btn_listar" class="botao_secundario">Listar tudo</button>
                </div>
            </form>

            <div id="lista_movimentos"></div>
        </section>
    </main>

    <footer id="rodape"></footer>
</body>

</html>
