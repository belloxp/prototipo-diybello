<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="../img/favicon.png">
    <link rel="stylesheet" href="../css/style.css">
    <script src="../js/config.js" defer></script>
    <script src="../js/carrinho.js" defer></script>
    <script src="../js/componentes.js" defer></script>
    <script src="../js/adminPedidos.js" defer></script>

    <title>Movimentação de Vendas - DIYBELLO</title>
</head>

<body>
    <header id="cabecalho"></header>

    <main>
        <div class="cabecalho_pagina">
            <h1>Movimentação de Vendas</h1>
            <p>
                Todos os pedidos da loja com os itens vendidos, o status do pagamento
                e o rastreamento da entrega.
            </p>
            <p><a href="./admin.html">Voltar ao painel</a></p>
        </div>

        <div class="indicadores" id="indicadores"></div>

        <form class="barra_filtros" id="form_busca">
            <div class="campo">
                <label for="busca">Consultar por código do pedido ou cliente</label>
                <input type="text" id="busca" placeholder="Ex: 1, Cliente Teste">
            </div>
            <div class="campo">
                <label for="filtro_status">Status do pedido</label>
                <select id="filtro_status">
                    <option value="">Todos</option>
                    <option value="PENDENTE">Pendente</option>
                    <option value="PAGO">Pago</option>
                    <option value="CANCELADO">Cancelado</option>
                </select>
            </div>
            <div class="campo">
                <button type="submit">Consultar</button>
            </div>
            <div class="campo">
                <button type="button" id="btn_listar" class="botao_secundario">Listar tudo</button>
            </div>
        </form>

        <div id="resposta"></div>

        <div id="lista_pedidos"></div>
    </main>

    <footer id="rodape"></footer>
</body>

</html>
