<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="../img/favicon.png">
    <link rel="stylesheet" href="../css/style.css">
    <script src="../js/config.js" defer></script>
    <script src="../js/carrinho.js" defer></script>
    <script src="../js/componentes.js" defer></script>
    <script src="../js/catalogo.js" defer></script>

    <title>Catálogo - DIYBELLO</title>
</head>

<body>
    <header id="cabecalho"></header>

    <main>
        <div class="cabecalho_pagina">
            <h1>Catálogo de Kits</h1>
            <p>Caixas pré-prontas, combos temáticos e insumos avulsos para repor os seus materiais.</p>
        </div>

        <!-- ---------------- BUSCA E FILTROS (públicos) ---------------- -->
        <form class="barra_filtros" id="form_filtros">
            <div class="campo">
                <label for="busca">Buscar por nome</label>
                <input type="text" id="busca" placeholder="Ex: Box Aura, cera, aquarela">
            </div>

            <div class="campo">
                <label for="categoria_id">Categoria</label>
                <select id="categoria_id">
                    <option value="">Todas as categorias</option>
                </select>
            </div>

            <div class="campo">
                <label for="tipo">Tipo de produto</label>
                <select id="tipo">
                    <option value="">Todos</option>
                    <option value="CAIXA">Caixas pré-prontas</option>
                    <option value="COMBO">Combos temáticos</option>
                    <option value="AVULSO">Insumos avulsos</option>
                </select>
            </div>

            <div class="campo">
                <label for="nivel">Nível</label>
                <select id="nivel">
                    <option value="">Todos os níveis</option>
                    <option value="INICIANTE">Iniciante</option>
                    <option value="INTERMEDIARIO">Intermediário</option>
                    <option value="AVANCADO">Avançado</option>
                </select>
            </div>

            <div class="campo">
                <label for="tempo">Tempo de projeto</label>
                <select id="tempo">
                    <option value="">Qualquer tempo</option>
                    <option value="rapido">Rápido (até 45 min)</option>
                    <option value="fimdesemana">Fim de semana (acima de 45 min)</option>
                </select>
            </div>

            <div class="campo">
                <button type="submit" id="btn_filtrar">Filtrar</button>
            </div>

            <div class="campo">
                <button type="button" id="btn_limpar" class="botao_secundario">Limpar</button>
            </div>
        </form>

        <div id="resposta"></div>

        <div class="grade_cards" id="lista_produtos"></div>
    </main>

    <footer id="rodape"></footer>
</body>

</html>
