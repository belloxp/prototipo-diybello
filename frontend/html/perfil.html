<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="../img/favicon.png">
    <link rel="stylesheet" href="../css/style.css">
    <script src="../js/config.js" defer></script>
    <script src="../js/carrinho.js" defer></script>
    <script src="../js/componentes.js" defer></script>
    <script src="../js/validacao.js" defer></script>
    <script src="../js/perfil.js" defer></script>

    <title>Meu Perfil - DIYBELLO</title>
</head>

<body>
    <header id="cabecalho"></header>

    <main>
        <div class="cabecalho_pagina">
            <h1>Meu perfil</h1>
            <p>
                Consulta e atualização dos seus dados cadastrais.
                Tela privada, protegida pelo token JWT.
            </p>
        </div>

        <div id="resposta"></div>

        <form class="formulario">
            <h2>Dados da conta</h2>

            <div class="linha_form">
                <div class="campo">
                    <label for="id">Código do cliente</label>
                    <input type="text" id="id" disabled>
                </div>

                <div class="campo">
                    <label for="nivel_acesso">Nível de acesso</label>
                    <input type="text" id="nivel_acesso" disabled>
                </div>
            </div>

            <div class="campo">
                <label for="nome">Nome completo *</label>
                <input type="text" id="nome" required>
            </div>

            <div class="linha_form">
                <div class="campo">
                    <label for="email">E-mail *</label>
                    <input type="email" id="email" required>
                </div>

                <div class="campo">
                    <label for="senha">Nova senha</label>
                    <input type="password" id="senha" placeholder="Deixe em branco para não alterar">
                    <span class="ajuda">A troca de senha usa o método PATCH.</span>
                </div>
            </div>

            <div class="linha_form">
                <div class="campo">
                    <label for="cpf">CPF *</label>
                    <input type="text" id="cpf" maxlength="14" required>
                    <span class="ajuda" id="aviso_cpf"></span>
                </div>

                <div class="campo">
                    <label for="telefone">Telefone</label>
                    <input type="text" id="telefone" maxlength="15">
                </div>
            </div>

            <h2 style="margin-top: 22px;">Endereço de entrega</h2>

            <div class="linha_form">
                <div class="campo">
                    <label for="cep">CEP *</label>
                    <input type="text" id="cep" maxlength="9" required>
                    <span class="ajuda" id="aviso_cep"></span>
                </div>

                <div class="campo">
                    <label for="rua">Rua / Logradouro *</label>
                    <input type="text" id="rua" required>
                </div>
            </div>

            <div class="linha_form">
                <div class="campo">
                    <label for="numero">Número *</label>
                    <input type="text" id="numero" required>
                </div>

                <div class="campo">
                    <label for="complemento">Complemento</label>
                    <input type="text" id="complemento">
                </div>
            </div>

            <div class="linha_form">
                <div class="campo">
                    <label for="bairro">Bairro *</label>
                    <input type="text" id="bairro" required>
                </div>

                <div class="campo">
                    <label for="cidade">Cidade *</label>
                    <input type="text" id="cidade" required>
                </div>

                <div class="campo">
                    <label for="uf">UF *</label>
                    <input type="text" id="uf" maxlength="2" required>
                </div>
            </div>

            <div style="display: flex; gap: 10px; flex-wrap: wrap; margin-top: 14px;">
                <button type="button" id="btn_atualizar">Atualizar tudo (PUT)</button>
                <button type="button" id="btn_atualizar_parcial" class="botao_secundario">
                    Atualizar só o que mudei (PATCH)
                </button>
                <button type="button" id="btn_apagar" class="botao_perigo">Apagar minha conta</button>
            </div>
        </form>
    </main>

    <footer id="rodape"></footer>
</body>

</html>
